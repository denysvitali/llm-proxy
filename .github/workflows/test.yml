name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build embedded dashboard
        run: scripts/build-web.sh

      - name: Lint dashboard
        run: npm --prefix web run lint

      - name: Test dashboard data flow
        run: npm --prefix web test

      - name: Verify committed dashboard assets
        run: git diff --exit-code --stat -- internal/server/web/webdist
