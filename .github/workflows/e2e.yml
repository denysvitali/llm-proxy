name: E2E

# End-to-end tests: build llm-proxy, point Claude Code and Codex at it, and
# exercise a real upstream (Venice). Skips gracefully when the VENICE_API_KEY
# secret is not configured.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VENICE_MODEL: stealth-ox-alpha
      # Cheap, widely available paid route; override via repository variable
      # or edit here when prices/catalogs change.
      OPENROUTER_MODEL: openrouter/openai/gpt-4o-mini
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build llm-proxy
        run: go build -o llm-proxy .

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Configure proxy
        run: |
          set -euo pipefail
          mkdir -p /tmp/llm-proxy-e2e
          if [ -z "${VENICE_API_KEY:-}" ]; then
            echo "HAS_KEY=no" >> "$GITHUB_ENV"
            echo "VENICE_API_KEY not set; live-model E2E steps will be skipped"
          else
            echo "HAS_KEY=yes" >> "$GITHUB_ENV"
          fi
          cat > /tmp/llm-proxy-e2e/config.yaml <<EOF
          server:
            listen: 127.0.0.1:8090
          auth:
            file: /tmp/llm-proxy-e2e/keys.json
          log_level: info
          backends:
            - type: venice
              api_key_env: VENICE_API_KEY
          default_route:
            backend: venice
          EOF
          # Extra live backends are only configured when their secret exists,
          # so the job stays useful without them. Their smoke steps address
          # models by qualified ID, which bypasses routes and catalogs.
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "HAS_OPENROUTER=yes" >> "$GITHUB_ENV"
            sed -i '/^default_route:/i\  - type: openrouter\n    api_key_env: OPENROUTER_API_KEY' /tmp/llm-proxy-e2e/config.yaml
            # Venice's free tier rate-limits in bursts; fail over to
            # OpenRouter instead of burning the full retry budget on 429s.
            sed -i '/api_key_env: VENICE_API_KEY/a\    retry_attempts: 3\n    retry_max_backoff: 10s\n    fallbacks:\n      - backend: openrouter\n        model: openai/gpt-4o-mini' /tmp/llm-proxy-e2e/config.yaml
          else
            echo "OPENROUTER_API_KEY not set; OpenRouter smoke step will be skipped"
          fi
          if [ -n "${OPENCODE_API_KEY:-}" ]; then
            echo "HAS_OPENCODE=yes" >> "$GITHUB_ENV"
            sed -i '/^default_route:/i\  - type: opencode\n    api_key_env: OPENCODE_API_KEY' /tmp/llm-proxy-e2e/config.yaml
          else
            echo "OPENCODE_API_KEY not set; OpenCode Zen smoke step will be skipped"
          fi
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      # Create the user and key BEFORE starting the proxy: the server loads
      # the keystore once at startup and does not watch the file, so keys
      # written afterwards are unknown to it (401 on every request).
      - name: Create proxy user and key
        run: |
          set -euo pipefail
          ./llm-proxy keys create-user e2e --store /tmp/llm-proxy-e2e/keys.json
          ./llm-proxy keys create e2e --name ci --store /tmp/llm-proxy-e2e/keys.json | head -1 > /tmp/llm-proxy-e2e/proxy-key
          test -s /tmp/llm-proxy-e2e/proxy-key

      # Each step runs with a fresh environment, so the secret must be mapped
      # here too — llm-proxy reads it (api_key_env) when the serve step starts.
      - name: Start llm-proxy
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          ./llm-proxy serve --config /tmp/llm-proxy-e2e/config.yaml > /tmp/llm-proxy-e2e/proxy.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8090/healthz > /dev/null; then exit 0; fi
            sleep 0.2
          done
          echo "proxy did not become healthy"; cat /tmp/llm-proxy-e2e/proxy.log; exit 1

      # A valid key with an empty Venice balance answers HTTP 402, and an
      # invalid key answers HTTP 401 ("invalid API key") and an exhausted
      # model answers HTTP 429 ("currently overloaded"); skip the live-model
      # steps in those cases instead of failing every push. Any other probe
      # failure is real and fails the job.
      - name: Probe Venice inference
        run: |
          set -euo pipefail
          if [ "${HAS_KEY}" != "yes" ]; then
            echo "LIVE_INFERENCE=no" >> "$GITHUB_ENV"
            exit 0
          fi
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          touch /tmp/llm-proxy-e2e/probe.json
          code=$(curl -sS -o /tmp/llm-proxy-e2e/probe.json -w '%{http_code}' \
            http://127.0.0.1:8090/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"'$VENICE_MODEL'","max_tokens":16,"messages":[{"role":"user","content":"ping"}]}' || echo 000)
          if [ "$code" = "402" ] || [ "$code" = "429" ] || grep -qiE 'insufficient.*(usd|diem|balance)|invalid api key|authentication|spend limit|overloaded|rate limit' /tmp/llm-proxy-e2e/probe.json; then
            echo "LIVE_INFERENCE=no" >> "$GITHUB_ENV"
            echo "::notice title=Live-model E2E skipped::Venice rejected inference (HTTP $code). Fix the VENICE_API_KEY secret (paste the key exactly, no quotes/newline) or top up credits at https://venice.ai/settings/api."
            cat /tmp/llm-proxy-e2e/probe.json
          elif [ "$code" != "200" ]; then
            echo "unexpected probe failure (HTTP $code)"; cat /tmp/llm-proxy-e2e/probe.json; exit 1
          else
            echo "LIVE_INFERENCE=yes" >> "$GITHUB_ENV"
          fi

      - name: Smoke test Anthropic endpoint
        if: env.HAS_KEY == 'yes' && env.LIVE_INFERENCE == 'yes'
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          curl -fsS http://127.0.0.1:8090/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "Content-Type: application/json" \
            -d '{"model":"'$VENICE_MODEL'","max_tokens":64,"messages":[{"role":"user","content":"Reply with exactly: E2E_OK"}]}' \
            | tee /tmp/llm-proxy-e2e/messages.json
          grep -q "content" /tmp/llm-proxy-e2e/messages.json

      - name: Smoke test OpenAI endpoint
        if: env.HAS_KEY == 'yes' && env.LIVE_INFERENCE == 'yes'
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          curl -fsS http://127.0.0.1:8090/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"'$VENICE_MODEL'","max_tokens":64,"messages":[{"role":"user","content":"Reply with exactly: E2E_OK"}]}' \
            | tee /tmp/llm-proxy-e2e/chat.json
          grep -q "choices" /tmp/llm-proxy-e2e/chat.json

      - name: Claude Code end-to-end
        if: env.HAS_KEY == 'yes' && env.LIVE_INFERENCE == 'yes'
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          export ANTHROPIC_BASE_URL=http://127.0.0.1:8090
          export ANTHROPIC_AUTH_TOKEN="$KEY"
          claude --model "$VENICE_MODEL" -p "Reply with exactly: E2E_OK" | tee /tmp/llm-proxy-e2e/claude.out
          grep -q "E2E_OK" /tmp/llm-proxy-e2e/claude.out

      - name: Codex end-to-end
        if: env.HAS_KEY == 'yes' && env.LIVE_INFERENCE == 'yes'
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<EOF
          model = "$VENICE_MODEL"
          model_provider = "llm_proxy"

          [model_providers.llm_proxy]
          name = "llm-proxy"
          base_url = "http://127.0.0.1:8090/v1"
          env_key = "CODEX_PROVIDER_KEY"
          wire_api = "responses"
          requires_openai_auth = false
          EOF
          export CODEX_PROVIDER_KEY="$KEY"
          # Codex refreshes its model catalog from GET {base}/models at turn
          # startup and decodes it as {"models":[...]}; answering the OpenAI
          # {"object":"list","data":[...]} envelope wedges the turn with
          # "failed to decode models response: missing field `models`".
          # Assert the codex dialect, then feed the exact served body to the
          # real codex catalog parser (codex debug models) as a decode gate.
          curl -fsS -A "codex_app_server/0.149.0" \
            -H "Authorization: Bearer $KEY" \
            http://127.0.0.1:8090/v1/models -o /tmp/llm-proxy-e2e/models-codex.json
          jq -e 'has("models") and (.models | type == "array" and length > 0)' \
            /tmp/llm-proxy-e2e/models-codex.json > /dev/null
          jq -e '(.models[0] | has("slug") and has("display_name") and has("model_messages") and has("truncation_policy")) and (has("data") | not)' \
            /tmp/llm-proxy-e2e/models-codex.json > /dev/null
          codex debug models -c model_catalog_json=/tmp/llm-proxy-e2e/models-codex.json \
            | tee /tmp/llm-proxy-e2e/codex-catalog.out
          grep -q "\"slug\":\"venice/$VENICE_MODEL\"" /tmp/llm-proxy-e2e/codex-catalog.out
          # Every other client keeps the OpenAI list envelope.
          curl -fsS -H "Authorization: Bearer $KEY" \
            http://127.0.0.1:8090/v1/models | jq -e '.object == "list" and (.data | length > 0)' > /dev/null
          codex exec --skip-git-repo-check "Reply with exactly: E2E_OK" | tee /tmp/llm-proxy-e2e/codex.out
          grep -q "E2E_OK" /tmp/llm-proxy-e2e/codex.out

      # Same skip-on-auth/billing contract as the Venice probe: a 401/402/429
      # means the secret or the account is the problem, not the proxy. The
      # proxy's own retry policy may hold the request for a while when the
      # upstream rate-limits, hence the generous curl timeout.
      - name: Smoke test OpenRouter backend
        if: env.HAS_OPENROUTER == 'yes'
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          touch /tmp/llm-proxy-e2e/openrouter.json
          code=$(curl -sS --max-time 300 -o /tmp/llm-proxy-e2e/openrouter.json -w '%{http_code}' \
            http://127.0.0.1:8090/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"'$OPENROUTER_MODEL'","max_tokens":32,"messages":[{"role":"user","content":"Reply with exactly: E2E_OK"}]}')
          if [ "$code" != "200" ]; then
            echo "::notice title=OpenRouter smoke skipped::upstream answered HTTP $code"
            cat /tmp/llm-proxy-e2e/openrouter.json
            exit 0
          fi
          grep -q "choices" /tmp/llm-proxy-e2e/openrouter.json
          grep -q "E2E_OK" /tmp/llm-proxy-e2e/openrouter.json

      - name: Smoke test OpenCode Zen backend
        if: env.HAS_OPENCODE == 'yes'
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-e2e/proxy-key)
          # Zen's catalog is live; pick its first served model as a qualified ID.
          MODEL=$(curl -fsS --max-time 60 "http://127.0.0.1:8090/v1/models?backend=opencode" | jq -r '.data[0].id')
          echo "smoking opencode model: $MODEL"
          touch /tmp/llm-proxy-e2e/opencode.json
          code=$(curl -sS --max-time 300 -o /tmp/llm-proxy-e2e/opencode.json -w '%{http_code}' \
            http://127.0.0.1:8090/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "Content-Type: application/json" \
            -d '{"model":"'$MODEL'","max_tokens":32,"messages":[{"role":"user","content":"Reply with exactly: E2E_OK"}]}')
          if [ "$code" != "200" ]; then
            echo "::notice title=OpenCode smoke skipped::upstream answered HTTP $code"
            cat /tmp/llm-proxy-e2e/opencode.json
            exit 0
          fi
          grep -q "content" /tmp/llm-proxy-e2e/opencode.json

      - name: Dump proxy log on failure
        if: failure()
        run: cat /tmp/llm-proxy-e2e/proxy.log || true

      - name: Stop llm-proxy
        if: always()
        run: pkill -f 'llm-proxy serve' || true

  # Secret-free E2E against the mock upstream: covers the Codex model
  # catalog dialect and a full codex turn on every push, even when the
  # live-inference secrets are not configured.
  e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build llm-proxy
        run: go build -o llm-proxy .

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Start mock upstream and proxy
        run: |
          set -euo pipefail
          mkdir -p /tmp/llm-proxy-mock
          python3 scripts/e2e/mock_upstream.py 9911 > /tmp/llm-proxy-mock/mock.log 2>&1 &
          # Wait for the mock's catalog endpoint before the proxy's first
          # catalog fetch, or /v1/models races to a 502.
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:9911/v1/models > /dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:9911/v1/models > /dev/null
          cat > /tmp/llm-proxy-mock/config.yaml <<EOF
          server:
            listen: 127.0.0.1:8090
          auth:
            file: /tmp/llm-proxy-mock/keys.json
          log_level: info
          backends:
            - type: venice
              api_key_env: MOCK_UPSTREAM_KEY
              base_url: http://127.0.0.1:9911/v1
          default_route:
            backend: venice
          EOF
          ./llm-proxy keys create-user e2e --store /tmp/llm-proxy-mock/keys.json
          ./llm-proxy keys create e2e --name ci --store /tmp/llm-proxy-mock/keys.json | head -1 > /tmp/llm-proxy-mock/proxy-key
          test -s /tmp/llm-proxy-mock/proxy-key
          MOCK_UPSTREAM_KEY=dummy ./llm-proxy serve --config /tmp/llm-proxy-mock/config.yaml > /tmp/llm-proxy-mock/proxy.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8090/healthz > /dev/null; then exit 0; fi
            sleep 0.2
          done
          echo "proxy did not become healthy"; cat /tmp/llm-proxy-mock/proxy.log; exit 1

      - name: Codex model catalog dialect
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-mock/proxy-key)
          # Codex refreshes its model catalog from GET {base}/models at turn
          # startup and decodes it as {"models":[...]}; answering the OpenAI
          # {"object":"list","data":[...]} envelope wedges the turn with
          # "failed to decode models response: missing field `models`".
          # Assert the codex dialect, then feed the exact served body to the
          # real codex catalog parser (codex debug models) as a decode gate.
          curl -fsS -A "codex_app_server/0.149.0" \
            -H "Authorization: Bearer $KEY" \
            http://127.0.0.1:8090/v1/models -o /tmp/llm-proxy-mock/models-codex.json
          jq -e 'has("models") and (.models | type == "array" and length > 0)' \
            /tmp/llm-proxy-mock/models-codex.json > /dev/null
          jq -e '(.models[0] | has("slug") and has("display_name") and has("model_messages") and has("truncation_policy")) and (has("data") | not)' \
            /tmp/llm-proxy-mock/models-codex.json > /dev/null
          codex debug models -c model_catalog_json=/tmp/llm-proxy-mock/models-codex.json \
            | tee /tmp/llm-proxy-mock/codex-catalog.out
          grep -q '"slug":"venice/stealth-mock"' /tmp/llm-proxy-mock/codex-catalog.out
          # Every other client keeps the OpenAI list envelope.
          curl -fsS -H "Authorization: Bearer $KEY" \
            http://127.0.0.1:8090/v1/models | jq -e '.object == "list" and (.data | length > 0)' > /dev/null

      - name: Codex end-to-end against mock upstream
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/llm-proxy-mock/proxy-key)
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<EOF
          model = "venice/stealth-mock"
          model_provider = "llm_proxy"

          [model_providers.llm_proxy]
          name = "llm-proxy"
          base_url = "http://127.0.0.1:8090/v1"
          env_key = "CODEX_PROVIDER_KEY"
          wire_api = "responses"
          requires_openai_auth = false
          EOF
          export CODEX_PROVIDER_KEY="$KEY"
          codex exec --skip-git-repo-check "Reply with exactly: E2E_OK" | tee /tmp/llm-proxy-mock/codex.out
          grep -q "E2E_OK" /tmp/llm-proxy-mock/codex.out

      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/llm-proxy-mock/proxy.log || true
          tail -50 /tmp/llm-proxy-mock/mock.log || true

      - name: Stop background processes
        if: always()
        run: |
          pkill -f 'llm-proxy serve' || true
          pkill -f 'mock_upstream.py' || true
