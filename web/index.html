<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="llm-proxy gateway console: live traffic, model performance, provider health, and client setup." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Geist-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>llm-proxy</title>
    <script>
      try {
        const storedColorScheme = window.localStorage.getItem('mantine-color-scheme-value')
        const colorScheme = ['light', 'auto', 'dark'].includes(storedColorScheme)
          ? storedColorScheme
          : 'auto'
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const resolved = colorScheme === 'auto' ? (prefersDark ? 'dark' : 'light') : colorScheme
        document.documentElement.setAttribute('data-mantine-color-scheme', resolved)
        // Paint the canvas before the bundle loads so the first frame is not
        // a white flash on a dark session.
        document.documentElement.style.backgroundColor = resolved === 'dark' ? '#111113' : '#fafafa'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
